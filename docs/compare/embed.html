<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>StepAhead · Default IK vs StepAhead (embed)</title>
<meta name="description" content="Drag the slider to compare default foot IK with StepAhead, predictive foot placement for Unreal Engine.">
<style>
  :root {
    --bg: #0d1117;
    --panel: #141a22;
    --text: #e8edf2;
    --dim: #9aa7b4;
    --accent: #2dd4bf;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  /* the guide page's background (docs/assets/css/style.scss $bg); dark scheme, else the browser paints the frame white */
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #121418; color: var(--text); font-family: var(--font); }
  main { max-width: 1280px; margin: 0 auto; padding: 0; }
  h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); margin: 0 0 24px; font-size: clamp(15px, 1.6vw, 18px); }
  .rule { width: 80px; height: 4px; background: var(--accent); border-radius: 2px; margin: 14px 0 22px; }

  .compare {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 12px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06);
    touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize;
  }
  .compare canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .divider {
    position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; left: 50%;
    background: #fff; box-shadow: 0 0 18px rgba(45,212,191,.75);
    pointer-events: none;
  }
  .handle {
    position: absolute; top: 50%; left: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: #fff; color: #0b0f14;
    display: grid; place-items: center; font-weight: 800; font-size: 20px; letter-spacing: 2px;
    box-shadow: 0 4px 18px rgba(0,0,0,.45), 0 0 0 3px rgba(45,212,191,.9);
    cursor: ew-resize; outline: none;
  }
  .handle:focus-visible { box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--accent); }
  .label {
    position: absolute; top: 16px; padding: 8px 14px; border-radius: 8px;
    font-weight: 600; font-size: clamp(12px, 1.5vw, 18px); pointer-events: none;
    transition: opacity .2s;
  }
  .label.left { left: 16px; background: rgba(11,15,20,.75); color: #fff; }
  .label.right { right: 16px; background: var(--accent); color: #0b0f14; }
  .hint {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(11,15,20,.75); color: #fff; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    pointer-events: none; transition: opacity .4s;
  }
  .msg { position: absolute; inset: 0; display: none; place-items: center; color: var(--dim); font-size: 15px; text-align: center; padding: 20px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  button {
    font: 600 14px var(--font); color: var(--text); background: var(--panel);
    border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 9px 14px; cursor: pointer;
  }
  button:hover { border-color: rgba(45,212,191,.6); }
  button[aria-pressed="true"] { background: rgba(45,212,191,.15); border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }
  .note { color: var(--dim); font-size: 13px; }
  @media (max-width: 640px) { .note { display: none; } }  /* keep the controls on one row: the guide sizes the frame for it */
</style>
</head>
<body>
<main>
  <div class="compare" id="compare">
    <canvas id="canvas" aria-hidden="true"></canvas>
    <span class="label left" id="labL">Default IK</span>
    <span class="label right" id="labR">StepAhead</span>
    <div class="divider" id="divider"></div>
    <div class="handle" id="handle" role="slider" tabindex="0" aria-label="Comparison position"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">‹ ›</div>
    <div class="hint" id="hint">Drag to compare</div>
    <div class="msg" id="msg">The comparison video could not be loaded.<br>Make sure stepahead_compare.mp4 is in the same folder as this page.</div>
  </div>

  <div class="controls">
    <button id="play" aria-pressed="false">Pause</button>
    <button id="slow" aria-pressed="false">Slow motion</button>
    <button id="restart">Restart</button>
    <span class="spacer"></span>
    <span class="note">Same moment, same terrain. Real gameplay recorded in Unreal Engine.</span>
  </div>
</main>

<!-- One video holds both views: Default IK on top, StepAhead on the bottom, so they can never drift out of sync. -->
<video id="video" src="stepahead_compare.mp4" muted loop playsinline autoplay preload="auto" style="display:none"></video>

<script>
(() => {
  const video = document.getElementById('video');
  const box = document.getElementById('compare');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const divider = document.getElementById('divider');
  const handle = document.getElementById('handle');
  const labL = document.getElementById('labL');
  const labR = document.getElementById('labR');
  const hint = document.getElementById('hint');
  const playBtn = document.getElementById('play');
  const slowBtn = document.getElementById('slow');

  let pos = 0.5;            // 0..1, line position from the left
  let userMoved = false;    // stop the intro sweep once the visitor takes over
  let dragging = false;
  const t0 = performance.now();

  function setPos(p) {
    pos = Math.min(1, Math.max(0, p));
    const pct = (pos * 100).toFixed(3) + '%';
    divider.style.left = pct;
    handle.style.left = pct;
    handle.setAttribute('aria-valuenow', Math.round(pos * 100));
    labL.style.opacity = Math.min(1, Math.max(0, (pos - 0.12) / 0.1));
    labR.style.opacity = Math.min(1, Math.max(0, (0.88 - pos) / 0.1));
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.min(1280, Math.round(box.clientWidth * dpr));
    canvas.width = w;
    canvas.height = Math.round(w * 9 / 16);
  }

  // intro: gentle sweep until the visitor interacts
  function introPos(t) {
    const s = (t / 1000) % 7;
    const ease = u => u * u * (3 - 2 * u);
    if (s < 1) return 0.5;
    if (s < 2.5) return 0.5 - 0.3 * ease((s - 1) / 1.5);
    if (s < 3.2) return 0.2;
    if (s < 5.2) return 0.2 + 0.6 * ease((s - 3.2) / 2);
    if (s < 5.9) return 0.8;
    return 0.8 - 0.3 * ease((s - 5.9) / 1.1);
  }

  function draw(now) {
    if (!userMoved) setPos(introPos(now - t0));
    if (video.readyState >= 2) {
      const W = canvas.width, H = canvas.height;
      const vw = video.videoWidth, vh = video.videoHeight / 2;
      ctx.drawImage(video, 0, 0, vw, vh, 0, 0, W, H);              // Default IK (top half)
      const x = Math.round(pos * W);
      ctx.save();
      ctx.beginPath(); ctx.rect(x, 0, W - x, H); ctx.clip();
      ctx.drawImage(video, 0, vh, vw, vh, 0, 0, W, H);             // StepAhead (bottom half)
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }

  function fromEvent(e) {
    const r = box.getBoundingClientRect();
    return (e.clientX - r.left) / r.width;
  }
  function takeOver() {
    if (!userMoved) { userMoved = true; hint.style.opacity = 0; }
  }

  box.addEventListener('pointerdown', e => {
    dragging = true; takeOver(); setPos(fromEvent(e));
    box.setPointerCapture(e.pointerId);
  });
  box.addEventListener('pointermove', e => { if (dragging) setPos(fromEvent(e)); });
  ['pointerup', 'pointercancel'].forEach(t => box.addEventListener(t, () => { dragging = false; }));

  handle.addEventListener('keydown', e => {
    const step = e.shiftKey ? 0.1 : 0.02;
    if (e.key === 'ArrowLeft') { takeOver(); setPos(pos - step); e.preventDefault(); }
    if (e.key === 'ArrowRight') { takeOver(); setPos(pos + step); e.preventDefault(); }
    if (e.key === 'Home') { takeOver(); setPos(0); e.preventDefault(); }
    if (e.key === 'End') { takeOver(); setPos(1); e.preventDefault(); }
  });

  playBtn.addEventListener('click', () => {
    if (video.paused) { video.play(); playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-pressed', 'false'); }
    else { video.pause(); playBtn.textContent = 'Play'; playBtn.setAttribute('aria-pressed', 'true'); }
  });
  slowBtn.addEventListener('click', () => {
    const slow = video.playbackRate === 1;
    video.playbackRate = slow ? 0.5 : 1;
    slowBtn.setAttribute('aria-pressed', String(slow));
  });
  document.getElementById('restart').addEventListener('click', () => {
    video.currentTime = 0; video.play(); playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-pressed', 'false');
  });

  // some browsers block autoplay until a click: start on first interaction
  box.addEventListener('pointerdown', () => { if (video.paused && playBtn.textContent === 'Pause') video.play().catch(() => {}); }, { once: true });
  video.addEventListener('error', () => { document.getElementById('msg').style.display = 'grid'; });

  window.addEventListener('resize', resize);
  resize(); setPos(0.5);
  video.play().catch(() => {});
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
